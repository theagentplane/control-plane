name: API or schema change proposal
description: Propose a new or changed endpoint, response field, setting or table.
labels: ["api"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and why?
    validations:
      required: true
  - type: dropdown
    id: compat
    attributes:
      label: Compatibility
      options:
        - Compatible (additive only)
        - Breaking (needs a new major version)
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Affected consumers and migration
      description: Which of Chronicle, TokenOps and the web page are affected, and what must each do?
    validations:
      required: true
