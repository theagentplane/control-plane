name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job gets more than read access to the repository contents.
permissions: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - run: uv run python -m mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --python "$PYTHON_VERSION"
        shell: bash
      - name: Test
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PYTHON_VERSION" python -m pytest --cov
        shell: bash

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - run: uv build
      - run: uv run twine check dist/*
      - name: Wheel ships the typing marker and the migrations
        run: |
          unzip -l dist/*.whl | grep -q "control_plane/py.typed"
          unzip -l dist/*.whl | grep -q "control_plane/db/migrations/versions/"

  chronicle-e2e:
    name: Chronicle end-to-end tests against this control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The Chronicle release whose real-control-plane tests run against this checkout.
      CHRONICLE_REF: v1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control-plane
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theagentplane/chronicle
          ref: ${{ env.CHRONICLE_REF }}
          path: chronicle
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: chronicle/pyproject.toml
      - name: Install Chronicle's test environment and this control plane
        working-directory: chronicle
        run: |
          uv sync
          uv pip install -e ../control-plane
      - name: Run the real-control-plane tests
        working-directory: chronicle
        run: uv run --no-sync python -m pytest tests/e2e/test_real_control_plane.py -q
