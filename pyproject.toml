[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentplane-control-plane"
version = "0.2.1"
description = "Shared AgentPlane control plane: Chronicle envelopes + TokenOps governance over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Susheem Koul" },
  { name = "Tisha Chawla" },
]
keywords = [
  "llm",
  "agents",
  "control-plane",
  "observability",
  "governance",
  "chronicle",
  "tokenops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "psutil>=5.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "pandas>=2"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff==0.15.22",
  "build>=1.2",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/theagentplane/control-plane"
Repository = "https://github.com/theagentplane/control-plane"
Issues = "https://github.com/theagentplane/control-plane/issues"
Changelog = "https://github.com/theagentplane/control-plane/blob/main/CHANGELOG.md"

[project.scripts]
control-plane = "control_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "control_plane/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["control_plane", "tests"]
